<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QUOC KOREA</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/m3, /en/gran-tourer ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/quoc/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/quoc/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'm3-pro':'m3', 'm3-air':'m3', 'm3pro':'m3', 'm3air':'m3', 'gran-tourer':'gt3', 'gran-tourer-iii':'gt3', 'grantourer':'gt3', 'gt':'gt3',
                'escape-road':'escape', 'escape-road-lace':'escape', 'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'showroom', 'dealers':'showroom' };
  var map = { brand:1, m3:1, gt3:1, motion:1, escape:1, story:1, showroom:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#000}</style>
</head>
<body></body>
</html>
